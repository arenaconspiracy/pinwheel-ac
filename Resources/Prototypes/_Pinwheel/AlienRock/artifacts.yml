- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseAlienRock
  categories: [ DoNotMap ]
  name: alien artifact
  description: sample text
  components:
  # visual
  - type: Sprite
    sprite: _Pinwheel/AlienRock/artifacts.rsi
    noRot: true
    layers:
    - state: radiation
  - type: PointLight
    castShadows: false
    radius: 6 # set based on the number of nodes dynamically
    energy: 3
    falloff: 5
  - type: InteractionOutline
  # physics
  - type: Physics
    bodyType: Dynamic
  - type: Transform
    noRot: true
    anchored: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        density: 75
        mask: [ MachineMask ]
        layer: [ Opaque ]
  - type: Anchorable
    flags: [ None ]
  # function
  - type: ContainerContainer
    containers:
      nodes: !type:Container
  - type: AlienRock
    nodeTable: !type:NestedSelector
      tableId: AlienRockNodeTable
  - type: Damageable
  - type: Injurable
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch]

- type: entity
  parent: BaseAlienRock
  id: AlienRockMundane # rock with no passive ill effects, never to be seen during a real round
  suffix: Debug

- type: entity
  parent: BaseAlienRock
  id: AlienRockFire
  components:
  - type: Sprite
    layers:
    - state: fire
  - type: PointLight
    color: "#F80"

- type: entity
  parent: BaseAlienRock
  id: AlienRockIce
  components:
  - type: Sprite
    layers:
    - state: ice
  - type: PointLight
    color: "#2Af"

- type: entity
  parent: BaseAlienRock
  id: AlienRockRadiation
  components:
  - type: Sprite
    layers:
    - state: radiation
  - type: PointLight
    color: "#2f2"
