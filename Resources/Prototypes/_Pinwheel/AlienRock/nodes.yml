- type: entityTable
  id: AlienRockNodeTable
  table: !type:GroupSelector
    children:
    - id: AlienNodeDamage
      conditions: &c [ !type:UniqueCondition ]
    - id: AlienNodeReactiveBlood # PRO-TEM: this is gaudy and sourcing new blood is inconvenient and arguably roleplay nonconductive
      conditions: *c
    - id: AlienNodeReactiveWater
      conditions: *c
    - id: AlienNodeToolSawing
      conditions: *c
    - id: AlienNodeToolAnchoring # PRO-TEM: science gear shouldn't overlap w/ engineering
      conditions: *c
    - id: AlienNodeToolPrying # PRO-TEM: ditto
      conditions: *c
    - id: AlienNodeToolScrewing # PRO-TEM: ditto
      conditions: *c
    - id: AlienNodeToolWelding # PRO-TEM: ditto
      conditions: *c

- type: entity
  id: AlienNodeDamage
  categories: [ HideSpawnMenu ]
  name: damage
  description: corporeal damage
  components:
  - type: AlienNodeDamage

- type: entity
  id: AlienNodeReactiveBlood
  categories: [ HideSpawnMenu ]
  name: reactive, blood
  description: blood reaction # this needs a better name
  components:
  - type: AlienNodeReactive
    reagents:
    - AmmoniaBlood
    - Blood
    - CopperBlood
    - InsectBlood
    - Sap
    - Slime
    - SulfurBlood
    - ZombieBlood

- type: entity
  id: AlienNodeReactiveWater
  categories: [ HideSpawnMenu ]
  name: reactive, water
  description: water reaction # hydrophobia?
  components:
  - type: AlienNodeReactive
    reagents:
    - Water
    - Holywater # why is it capitalized like this

- type: entity
  id: AlienNodeToolSawing
  categories: [ HideSpawnMenu ]
  name: tool use, sawing
  description: sample text
  components:
  - type: AlienNodeToolUse
    quality: Sawing

- type: entity
  id: AlienNodeToolAnchoring
  categories: [ HideSpawnMenu ]
  name: tool use, anchoring
  description: sample text
  components:
  - type: AlienNodeToolUse
    quality: Anchoring

- type: entity
  id: AlienNodeToolPrying
  categories: [ HideSpawnMenu ]
  name: tool use, prying
  description: sample text
  components:
  - type: AlienNodeToolUse
    quality: Prying

- type: entity
  id: AlienNodeToolScrewing
  categories: [ HideSpawnMenu ]
  name: tool use, screwing
  description: sample text
  components:
  - type: AlienNodeToolUse
    quality: Screwing

- type: entity
  id: AlienNodeToolWelding
