- type: entity
  abstract: true
  id: BaseInflectionLocus
  categories: [ DoNotMap ]
  name: spatial inflection locus
  description: An anomalous bend in the geometry of space in local reality. It might turn inside out any moment now.
  components:
  # visual
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: Structures/Specific/anomaly.rsi # PLACEHOLDER
    state: anom1
  - type: Appearance
  - type: InteractionOutline
  - type: Clickable
  # physics
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    bodyStatus: InAir
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask: [ FlyingMobMask ]
        layer: [ FlyingMobLayer ]
  # function
  - type: Damageable
  - type: InflectionLocus
    soundSpawn:
      collection: LocusSpawn

- type: entity
  parent: BaseInflectionLocus
  id: InflectionLocusDebug
  categories: [ Debug ]
  components:
  - type: InflectionLocus
    criticalMax: 3m
    criticalMin: 1m

- type: soundCollection
  id: LocusAmbient
  files:
  - /Audio/Ambience/anomaly_drone.ogg # PLACEHOLDER

- type: soundCollection
  id: LocusSpawn
  files:
  - /Audio/Effects/teleport_arrival.ogg # PLACEHOLDER
